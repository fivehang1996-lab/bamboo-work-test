<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《绿梦：时空之声》付费测前线下CE — 研究方案</title>
<style>
:root {
  --bg: #0b0f14; --surface: #161c24; --text: #d5dbe3;
  --accent: #5b9eff; --green: #46c268; --red: #e8483b;
  --yellow: #e0a730; --purple: #a371f7; --cyan: #39c5cf;
  --muted: #8895a4; --border: #222830; --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background: var(--bg); color: var(--text);
  overflow: hidden; height: 100vh;
  user-select: none; -webkit-font-smoothing: antialiased;
}
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px;
  background:linear-gradient(to bottom, rgba(11,15,20,.95), transparent);
}
.topbar .logo { font-weight:700; font-size:.92em; color:var(--accent); letter-spacing:.04em; }
.topbar .ct { font-size:.78em; color:var(--muted); background:var(--surface); padding:4px 12px; border-radius:99px; border:1px solid var(--border); }
.progress-wrap { position:fixed; top:0; left:0; right:0; z-index:210; height:3px; background:transparent; }
.progress-fill { height:100%; background:var(--accent); width:0%; transition:width .3s linear; }
.stage { width:100vw; height:100vh; position:relative; }
.scene {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:70px 50px 130px;
  opacity:0; transform:scale(.96);
  transition:opacity .5s ease, transform .5s ease;
  pointer-events:none;
}
.scene.on { opacity:1; transform:scale(1); pointer-events:auto; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px 38px; max-width:920px; width:100%; margin:6px 0; box-shadow:0 6px 28px rgba(0,0,0,.5); }
.card-sm { padding:20px 28px; max-width:680px; }
.ca { border-left:3px solid var(--accent); } .cg { border-left:3px solid var(--green); }
.cr { border-left:3px solid var(--red); } .cy { border-left:3px solid var(--yellow); }
.cp { border-left:3px solid var(--purple); } .cc { border-left:3px solid var(--cyan); }
h1 { font-size:2.2em; font-weight:800; color:#fff; letter-spacing:.02em; margin-bottom:6px; line-height:1.2; }
h2 { font-size:1.4em; font-weight:700; color:var(--accent); margin-bottom:12px; }
h3 { font-size:1.1em; font-weight:600; color:#e8edf3; margin-bottom:6px; }
p { font-size:1.0em; line-height:1.65; }
.mu { color:var(--muted); } .sm { font-size:.84em; }
.big-num { font-size:3.0em; font-weight:800; line-height:1; }
.tag { display:inline-block; padding:3px 9px; border-radius:99px; font-size:.75em; font-weight:600; margin-right:5px; margin-bottom:4px; }
.tr { background:rgba(232,72,59,.12); color:var(--red); border:1px solid rgba(232,72,59,.25); }
.tg { background:rgba(70,194,104,.12); color:var(--green); border:1px solid rgba(70,194,104,.25); }
.ty { background:rgba(224,167,48,.12); color:var(--yellow); border:1px solid rgba(224,167,48,.25); }
.ta { background:rgba(91,158,255,.12); color:var(--accent); border:1px solid rgba(91,158,255,.25); }
.tp { background:rgba(163,113,247,.12); color:var(--purple); border:1px solid rgba(163,113,247,.25); }
.tc { background:rgba(57,197,207,.12); color:var(--cyan); border:1px solid rgba(57,197,207,.25); }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:920px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; width:100%; max-width:920px; }
.grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; width:100%; max-width:920px; }
.narration-bar {
  position:fixed; bottom:94px; left:50%; transform:translateX(-50%); z-index:150;
  background:rgba(22,28,36,.92); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 24px;
  max-width:800px; width:90%; text-align:center;
  backdrop-filter:blur(12px);
  opacity:0; transition:opacity .3s ease;
}
.narration-bar.on { opacity:1; }
.narration-bar .nt { font-size:1.05em; line-height:1.6; color:#fff; }
.narration-bar .nl { font-size:.7em; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:5px; }
.controls {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:center; gap:16px;
  padding:18px 30px 24px;
  background:linear-gradient(transparent, rgba(11,15,20,.96) 50%);
}
.btn {
  background:rgba(255,255,255,.06); border:1px solid var(--border);
  color:var(--text); padding:9px 18px; border-radius:8px;
  font-size:.88em; cursor:pointer; transition:all .2s; font-family:inherit;
}
.btn:hover { background:rgba(255,255,255,.12); border-color:var(--accent); }
.btn:disabled { opacity:.3; cursor:default; }
.btn-play { padding:11px 26px; font-size:1em; font-weight:600; background:rgba(91,158,255,.15); border-color:var(--accent); }
.btn-play:hover { background:rgba(91,158,255,.25); }
.timeline-dots { display:flex; gap:8px; align-items:center; }
.tl-dot { width:7px; height:7px; border-radius:50%; background:var(--border); transition:all .3s ease; cursor:pointer; }
.tl-dot.done { background:var(--accent); }
.tl-dot.cur { background:var(--accent); transform:scale(1.7); box-shadow:0 0 8px rgba(91,158,255,.5); }
.cm { position:absolute; top:16px; left:24px; font-size:.72em; color:var(--muted); letter-spacing:.1em; font-family:monospace; }
@keyframes ri { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes si { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
.ar { animation:ri .5s ease both; } .ar1 { animation:ri .5s .1s ease both; }
.ar2 { animation:ri .5s .2s ease both; } .ar3 { animation:ri .5s .3s ease both; }
.ar4 { animation:ri .5s .4s ease both; } .as { animation:si .5s ease both; }
.ap { animation:pulse 2s ease-in-out infinite; }
.compare-row { display:flex; gap:14px; width:100%; max-width:920px; }
.compare-col { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.table-wrap { overflow-x:auto; width:100%; max-width:920px; }
table { width:100%; border-collapse:collapse; font-size:.84em; }
th { text-align:left; padding:8px 10px; border-bottom:2px solid var(--border); color:var(--accent); font-weight:600; font-size:.8em; }
td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:hover td { background:rgba(255,255,255,.015); }
.issue-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; }
.issue-card .ic-head { font-weight:700; font-size:.95em; margin-bottom:4px; }
.issue-card .ic-body { font-size:.82em; color:var(--muted); line-height:1.55; }
.module-row { display:flex; gap:10px; width:100%; max-width:920px; }
.module-col { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 16px; }
.module-col .mh { font-weight:700; margin-bottom:6px; font-size:.95em; }
.module-col .mb { font-size:.8em; color:var(--muted); line-height:1.5; }
.flow-step { display:flex; gap:8px; align-items:center; width:100%; max-width:920px; flex-wrap:wrap; justify-content:center; }
.flow-step .fs { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; text-align:center; min-width:80px; font-size:.82em; }
.flow-step .fs strong { display:block; font-size:1.1em; color:var(--accent); }
.flow-step .fa { color:var(--accent); font-size:1.2em; font-weight:700; }
@media (max-width:768px) {
  .scene { padding:40px 16px 150px; }
  .card { padding:20px 16px; }
  h1 { font-size:1.5em; }
  .grid-2,.grid-3,.grid-4,.compare-row { grid-template-columns:1fr; flex-direction:column; }
  .narration-bar { bottom:110px; }
}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">《绿梦：时空之声》付费测前线下CE</span>
  <span class="ct" id="chapterTag">开篇</span>
</div>
<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

<div class="narration-bar" id="narrationBar">
  <div class="nl">讲解</div>
  <div class="nt" id="narrationText"></div>
</div>

<div style="position:fixed;bottom:82px;left:50%;transform:translateX(-50%);z-index:180;" class="timeline-dots" id="timelineDots"></div>

<main class="stage" id="stage"></main>

<nav class="controls">
  <button class="btn" id="btnPrev"><</button>
  <button class="btn btn-play" id="btnPlay">Play</button>
  <button class="btn" id="btnNext">></button>
  <span style="color:var(--muted);font-size:.82em;min-width:46px;text-align:center;" id="timeDisplay">00:00</span>
</nav>

<script>
function $(id) { return document.getElementById(id); }
function H(arr) { return arr.join(''); }
var sceneData = [];
function S(chapter, duration, narration, html) { sceneData.push({chapter:chapter, duration:duration, narration:narration, html:html}); }

// ============================================================
// SCENES
// ============================================================

// -- 0: Title --
S('开篇', 7,
  '《绿梦：时空之声》付费测前最后一次CE。前序测试已经验证核心玩法方向，但蚀梦测试暴露了一系列关键问题。这次要回答的问题很多——产品修复有没有到位、商业化体系能不能被接受、玩家还会不会留下来、我们在竞品面前到底有什么不一样。',
  H([
    '<div class="card ca as" style="text-align:center;">',
      '<div style="font-size:.82em;color:var(--accent);letter-spacing:.12em;margin-bottom:12px;">付费测前 · 线下CE测试 · 研究方案</div>',
      '<h1 style="font-size:2.6em;">《绿梦：时空之声》</h1>',
      '<p style="font-size:1.15em;color:var(--muted);">横版箱庭闯关 + ACT战斗 · 付费系统首次验证</p>',
      '<div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">',
        '<span class="tag ta">4大研究模块</span><span class="tag tp">3组 x 7场</span><span class="tag ty">2.5H/组</span><span class="tag tc">2天执行</span>',
      '</div>',
    '</div>'
  ])
);

// -- 1: Background --
S('开篇', 10,
  '先看背景。横版箱庭闯关加ACT战斗的方向已经被多数玩家认可，角色美术持续是最大亮点。但蚀梦测试也扎扎实实地暴露了一堆问题：按键卡顿、战斗缺少联动、养成太复杂、UI全模块评分最低、主城跑图无聊。这些问题，这次必须看到改善。',
  H([
    '<h2>蚀梦测试暴露的核心问题</h2>',
    '<div class="grid-3">',
      '<div class="issue-card ar" style="border-top:3px solid var(--red);"><div class="ic-head">按键适配</div><div class="ic-body">移动端摇杆满意度3.76<br>按键满意度3.63<br>卡顿严重影响初期体验</div></div>',
      '<div class="issue-card ar1" style="border-top:3px solid var(--red);"><div class="ic-head">UI/UX</div><div class="ic-body">全模块评分最低 3.24/5<br>刻录抽卡UI、装备养成UI<br>均低于3.4</div></div>',
      '<div class="issue-card ar2" style="border-top:3px solid var(--yellow);"><div class="ic-head">养成系统</div><div class="ic-body">满意度3.27，62%不满意<br>70%玩家希望更简单<br>引导不足，概念名词复杂</div></div>',
      '<div class="issue-card ar3" style="border-top:3px solid var(--yellow);"><div class="ic-head">战斗体验</div><div class="ic-body">满意度3.50，47%不满意<br>缺少角色联动与差异化<br>信息提示3.30，流畅性3.30</div></div>',
      '<div class="issue-card ar4" style="border-top:3px solid var(--yellow);"><div class="ic-head">地图探索</div><div class="ic-body">探索满意度3.56，45%不满意<br>主城跑图无聊<br>引导为最低分维度</div></div>',
      '<div class="issue-card" style="border-top:3px solid var(--yellow);"><div class="ic-head">新手引导 & 心流</div><div class="ic-body">上手难度3.60，33%教学不满意<br>三处心流下滑点<br>奥鲁姆要塞/寻找薇诺娜/护送管理员</div></div>',
    '</div>'
  ])
);

// -- 2: Four Modules Overview --
S('第1章·框架', 8,
  '基于这些问题，这次研究分了四大模块：第一，产品向——验证七大核心体验的修复效果。第二，商业化向——付费系统第一次暴露给玩家，抽卡和皮肤的接受度必须摸清楚。第三，长期动力——玩家第二天之后还会不会继续玩？NPS能不能转正？第四，竞品对比——绿梦到底靠什么在竞品中站稳。',
  H([
    '<h2>四大研究模块</h2>',
    '<div class="grid-4" style="margin-top:4px;">',
      '<div class="module-col ar" style="border-top:3px solid var(--accent);"><div class="mh" style="color:var(--accent);">产品向</div><div class="mb">7项核心体验<br>修复效果验证</div><div style="margin-top:8px;"><span class="tag ta">模块一</span></div></div>',
      '<div class="module-col ar1" style="border-top:3px solid var(--purple);"><div class="mh" style="color:var(--purple);">商业化向</div><div class="mb">抽卡+皮肤<br>付费系统首次验证</div><div style="margin-top:8px;"><span class="tag tp">模块二·新增</span></div></div>',
      '<div class="module-col ar2" style="border-top:3px solid var(--green);"><div class="mh" style="color:var(--green);">长期动力</div><div class="mb">Day2存留+NPS<br>流失风险预判</div><div style="margin-top:8px;"><span class="tag tg">模块三</span></div></div>',
      '<div class="module-col ar3" style="border-top:3px solid var(--yellow);"><div class="mh" style="color:var(--yellow);">竞品对比</div><div class="mb">差异化定位<br>四圈层对标</div><div style="margin-top:8px;"><span class="tag ty">模块四</span></div></div>',
    '</div>',
    '<div class="card-sm ar4" style="margin-top:10px;text-align:center;">',
      '<p style="margin:0;font-weight:600;">每个模块都有蚀梦测试的量化基线 → 本次直接对账，看改善了多少</p>',
    '</div>'
  ])
);

// -- 3: Module 1 detail Part A --
S('第1章·产品向', 14,
  '产品向涉及七个验证点。最关键的三个：按键适配有没有改善、战斗联动能不能被玩家感知、养成系统到底减负了没有。每个问题都有蚀梦基线的量化参考——比如按键满意度之前才3.63、养成满意度3.27且六成二不满意。这次直接对这些数字对账。',
  H([
    '<h2>产品向：7项核心体验修复验证</h2>',
    '<div class="table-wrap as"><table>',
      '<thead><tr><th style="width:30px;">#</th><th>研究问题</th><th style="width:220px;">核心关注点</th><th style="width:140px;">蚀梦基线</th></tr></thead><tbody>',
      '<tr class="ar"><td style="color:var(--accent);font-weight:700;">1-1</td><td><strong>按键/操作适配</strong></td><td style="font-size:.82em;">移动端摇杆配合流畅性、右侧按键布局、自定义方案满意度</td><td style="font-size:.8em;">移动端摇杆3.76<br>按键3.63</td></tr>',
      '<tr class="ar1"><td style="color:var(--accent);font-weight:700;">1-2</td><td><strong>战斗体验</strong></td><td style="font-size:.82em;">角色连携/配队策略、战斗信息提示、闪避与打击反馈</td><td style="font-size:.8em;">战斗3.50，47%不满意<br>高玩党评价最低</td></tr>',
      '<tr class="ar2"><td style="color:var(--accent);font-weight:700;">1-3</td><td><strong>养成系统</strong></td><td style="font-size:.82em;">养成路径清晰度、资源获取难度、概念名词简化、素材副本效率</td><td style="font-size:.8em;">满意度3.27<br>62%不满意</td></tr>',
      '<tr class="ar3"><td style="color:var(--accent);font-weight:700;">1-4</td><td><strong>UI/UX</strong></td><td style="font-size:.82em;">主界面信息密度、关键功能入口可寻性、抽卡交互、战斗HUD</td><td style="font-size:.8em;"><span class="tag tr">全模块最低 3.24</span></td></tr>',
      '<tr class="ar4"><td style="color:var(--accent);font-weight:700;">1-5</td><td><strong>新手引导</strong></td><td style="font-size:.82em;">基础操作教学完成率、核心机制教学效果、心流三处下滑点是否改善</td><td style="font-size:.8em;">上手难度3.60<br>33%教学不满意</td></tr>',
      '<tr><td style="color:var(--accent);font-weight:700;">1-6</td><td><strong>地图探索</strong></td><td style="font-size:.82em;">地图指引清晰度、探索密度与奖励、平台跳跃接受度、主线卡点</td><td style="font-size:.8em;">探索3.56，45%不满意<br>引导为最低分维度</td></tr>',
      '<tr><td style="color:var(--accent);font-weight:700;">1-7</td><td><strong>剧情与演出</strong></td><td style="font-size:.82em;">新增剧情评价、AVG沉浸感、跳过功能灵活度、叙事风格接受度</td><td style="font-size:.8em;">配音满意度高<br>动作表情与沉浸感低</td></tr>',
      '</tbody></table></div>'
  ])
);

// -- 4: Module 2+3 --
S('第2章·商业+留存', 12,
  '商业化这块是第一次做——之前测试没有暴露付费系统，这次是全新的。核心两件事：抽卡体验公不公平、皮肤商店有没有人愿意花钱。长期动力这边，最关键的指标是NPS。蚀梦测试NPS在负百分之二十到负三十四，PC端尤其差。这次能不能转正，是判断产品能否撑住公测的关键信号。',
  H([
    '<h2>模块二：商业化向（首次验证）</h2>',
    '<div class="grid-2" style="margin-bottom:14px;">',
      '<div class="compare-col ar" style="border-top:3px solid var(--purple);"><div style="font-weight:700;margin-bottom:4px;">2-1 抽卡体验</div><div style="font-size:.82em;color:var(--muted);">卡池机制理解度 · 抽卡仪式感 · 出货体感 vs 实际概率 · 副产物价值感知 · 角色池/武器池划分合理性</div><div style="margin-top:6px;"><span class="tag tr">蚀梦TOP商业化痛点</span></div></div>',
      '<div class="compare-col ar1" style="border-top:3px solid var(--purple);"><div style="font-weight:700;margin-bottom:4px;">2-2 皮肤商店</div><div style="font-size:.82em;color:var(--muted);">定价感知（与竞品对比）· 皮肤设计吸引力 · 附加内容期待 · 限定/稀有的收藏驱动力</div></div>',
    '</div>',
    '<h2 style="margin-top:6px;">模块三：长期动力</h2>',
    '<div class="grid-3">',
      '<div class="compare-col ar2" style="border-top:3px solid var(--green);"><div style="font-weight:700;margin-bottom:4px;">3-1 Day2持续动力</div><div style="font-size:.82em;color:var(--muted);">养成深度 vs 负担感知<br>每日活跃内容吸引力<br>社交/公会粘性</div></div>',
      '<div class="compare-col ar3" style="border-top:3px solid var(--red);"><div style="font-weight:700;margin-bottom:4px;">3-2 流失风险</div><div style="font-size:.82em;color:var(--muted);">心流图节点流失意愿<br>流失原因分类<br>各分层差异</div></div>',

// ============================================================
// ENGINE
// ============================================================
var currentIdx = 0;
var playing = false;
var sceneTimer = null;
var elapsedInScene = 0;
var tickInterval = null;

var $stage = $('stage');
var $narrationBar = $('narrationBar');
var $narrationText = $('narrationText');
var $chapterTag = $('chapterTag');
var $progressFill = $('progressFill');
var $timeDisplay = $('timeDisplay');
var $timelineDots = $('timelineDots');
var $btnPlay = $('btnPlay');
var $btnPrev = $('btnPrev');
var $btnNext = $('btnNext');

sceneData.forEach(function(s, i) {
  var dot = document.createElement('span');
  dot.className = 'tl-dot';
  dot.title = 'Scene ' + (i+1) + ': ' + s.chapter;
  dot.onclick = (function(idx) { return function() { goTo(idx); }; })(i);
  $timelineDots.appendChild(dot);
});

sceneData.forEach(function(s, i) {
  var el = document.createElement('div');
  el.className = 'scene';
  el.id = 'scene-' + i;
  $stage.appendChild(el);
});

function renderScene(i) {
  var el = $('scene-' + i);
  el.innerHTML = '<div class="cm">' + sceneData[i].chapter + '</div>' + sceneData[i].html;
}

function showScene(i) {
  var all = document.querySelectorAll('.scene');
  for (var j = 0; j < all.length; j++) { all[j].classList.remove('on'); }
  renderScene(i);
  var el = $('scene-' + i);
  requestAnimationFrame(function() { el.classList.add('on'); });
  $narrationText.textContent = sceneData[i].narration;
  $narrationBar.classList.add('on');
  $chapterTag.textContent = sceneData[i].chapter;
  var dots = document.querySelectorAll('.tl-dot');
  for (var j = 0; j < dots.length; j++) {
    dots[j].className = 'tl-dot';
    if (j < i) dots[j].classList.add('done');
    if (j === i) dots[j].classList.add('cur');
  }
  $progressFill.style.width = ((i+1) / sceneData.length * 100) + '%';
}

function goTo(i) {
  if (i < 0 || i >= sceneData.length) return;
  stopAuto();
  currentIdx = i;
  elapsedInScene = 0;
  showScene(i);
  updateTime();
  updateButtons();
}

function updateTime() {
  var m = Math.floor(elapsedInScene / 60);
  var s = elapsedInScene % 60;
  $timeDisplay.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}

function updateButtons() {
  $btnPrev.disabled = (currentIdx === 0);
  $btnNext.disabled = (currentIdx === sceneData.length - 1);
}

function stopAuto() {
  playing = false;
  clearTimeout(sceneTimer);
  clearInterval(tickInterval);
  $btnPlay.textContent = 'Play';
}

function startAuto() {
  if (currentIdx >= sceneData.length - 1) { currentIdx = 0; showScene(0); }
  playing = true;
  $btnPlay.textContent = 'Pause';
  scheduleNext();
  tickInterval = setInterval(function() {
    elapsedInScene++;
    updateTime();
    if (elapsedInScene > sceneData[currentIdx].duration + 2) {
      if (currentIdx < sceneData.length - 1) { goTo(currentIdx + 1); if (playing) scheduleNext(); }
      else stopAuto();
    }
  }, 1000);
}

function scheduleNext() {
  clearTimeout(sceneTimer);
  sceneTimer = setTimeout(function() {
    if (!playing) return;
    if (currentIdx < sceneData.length - 1) { goTo(currentIdx + 1); scheduleNext(); }
    else stopAuto();
  }, sceneData[currentIdx].duration * 1000);
}

var controls = {
  toggle: function() { if (playing) stopAuto(); else startAuto(); },
  next: function() { stopAuto(); goTo(currentIdx + 1); },
  prev: function() { stopAuto(); goTo(currentIdx - 1); }
};

$btnPlay.onclick = controls.toggle;
$btnPrev.onclick = controls.prev;
$btnNext.onclick = controls.next;

document.addEventListener('keydown', function(e) {
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); controls.toggle(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); controls.next(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); controls.prev(); }
  if (e.key === 'Escape') stopAuto();
});

$btnPlay.textContent = 'Play';
$btnPrev.textContent = '<';
$btnNext.textContent = '>';
goTo(0);
updateButtons();
</script>
</body>
</html>
