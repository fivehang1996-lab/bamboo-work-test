<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《代号：搜哈》首次线下CE — 方案分析</title>
<style>
:root {
  --bg: #0b0f14;
  --surface: #161c24;
  --text: #d5dbe3;
  --accent: #5b9eff;
  --green: #46c268;
  --red: #e8483b;
  --yellow: #e0a730;
  --orange: #f07c3e;
  --muted: #8895a4;
  --border: #222830;
  --radius: 10px;
  --font-mono: 'JetBrains Mono','Cascadia Code','Fira Code',monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ---- Top Bar ---- */
.topbar {
  position: fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 28px;
  background: linear-gradient(to bottom, rgba(11,15,20,.95), transparent);
}
.topbar .logo { font-weight:700; font-size:.95em; color:var(--accent); letter-spacing:.04em; }
.topbar .chapter-tag { font-size:.8em; color:var(--muted); background:var(--surface); padding:4px 12px; border-radius:99px; border:1px solid var(--border); }

/* ---- Progress Bar ---- */
.progress-wrap {
  position: fixed; top:0; left:0; right:0; z-index:210; height:3px; background:transparent;
}
.progress-fill { height:100%; background:var(--accent); width:0%; transition:width .3s linear; }

/* ---- Stage ---- */
.stage { width:100vw; height:100vh; position:relative; }

/* ---- Scene ---- */
.scene {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: 80px 60px 140px;
  opacity:0; transform:scale(.96);
  transition: opacity .5s ease, transform .5s ease;
  pointer-events:none;
}
.scene.active { opacity:1; transform:scale(1); pointer-events:auto; }

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 48px;
  max-width: 860px; width:100%;
  margin: 8px 0;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.card-sm { padding:24px 32px; max-width:640px; }
.card-accent { border-left: 3px solid var(--accent); }
.card-red { border-left: 3px solid var(--red); }
.card-yellow { border-left: 3px solid var(--yellow); }
.card-green { border-left: 3px solid var(--green); }

/* ---- Text ---- */
h1 { font-size:2.6em; font-weight:800; color:#fff; letter-spacing:.02em; margin-bottom:6px; line-height:1.2; }
h2 { font-size:1.6em; font-weight:700; color:var(--accent); margin-bottom:14px; }
h3 { font-size:1.2em; font-weight:600; color:#e8edf3; margin-bottom:8px; }
p { font-size:1.08em; line-height:1.75; }
.muted { color:var(--muted); }
.small { font-size:.88em; }

.tag {
  display:inline-block; padding:3px 10px;
  border-radius:99px; font-size:.78em; font-weight:600;
  margin-right:6px; margin-bottom:4px;
}
.tag-r { background:rgba(232,72,59,.12); color:var(--red); border:1px solid rgba(232,72,59,.25); }
.tag-g { background:rgba(70,194,104,.12); color:var(--green); border:1px solid rgba(70,194,104,.25); }
.tag-y { background:rgba(224,167,48,.12); color:var(--yellow); border:1px solid rgba(224,167,48,.25); }
.tag-a { background:rgba(91,158,255,.12); color:var(--accent); border:1px solid rgba(91,158,255,.25); }

/* ---- Grid ---- */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; width:100%; max-width:880px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; width:100%; max-width:880px; }

/* ---- Big Number ---- */
.big-num { font-size:3.6em; font-weight:800; line-height:1; }
.big-num.g { color:var(--green); }
.big-num.r { color:var(--red); }
.big-num.y { color:var(--yellow); }

/* ---- Narration Bar (bottom subtitle) ---- */
.narration-bar {
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:150;
  background:rgba(22,28,36,.92); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 28px;
  max-width:780px; width:90%;
  text-align:center;
  backdrop-filter: blur(12px);
  opacity:0; transition:opacity .3s ease;
}
.narration-bar.visible { opacity:1; }
.narration-bar .narration-text { font-size:1.1em; line-height:1.6; color:#fff; }
.narration-bar .narration-label { font-size:.7em; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }

/* ---- Bottom Controls ---- */
.controls {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; justify-content:center; gap:18px;
  padding:20px 30px 28px;
  background: linear-gradient(transparent, rgba(11,15,20,.96) 50%);
}
.btn {
  background:rgba(255,255,255,.06); border:1px solid var(--border);
  color:var(--text); padding:10px 20px; border-radius:8px;
  font-size:.9em; cursor:pointer; transition:all .2s;
  font-family:inherit;
}
.btn:hover { background:rgba(255,255,255,.12); border-color:var(--accent); }
.btn:disabled { opacity:.3; cursor:default; }
.btn-play { padding:12px 28px; font-size:1em; font-weight:600; background:rgba(91,158,255,.15); border-color:var(--accent); }
.btn-play:hover { background:rgba(91,158,255,.25); }

/* ---- Timeline dots ---- */
.timeline-dots {
  display:flex; gap:10px; align-items:center;
}
.timeline-dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--border); transition:all .3s ease;
}
.timeline-dot.done { background:var(--accent); }
.timeline-dot.current { background:var(--accent); transform:scale(1.6); box-shadow:0 0 8px rgba(91,158,255,.5); }

/* ---- Chapter marker ---- */
.chapter-marker {
  position:absolute; top:20px; left:30px;
  font-size:.75em; color:var(--muted); letter-spacing:.1em;
  font-family:var(--font-mono);
}

/* ---- Animations ---- */
@keyframes riseIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes scaleIn { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); } }
@keyframes slideLeft { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }

.anim-rise  { animation: riseIn .5s ease both; }
.anim-rise-d1 { animation: riseIn .5s .1s ease both; }
.anim-rise-d2 { animation: riseIn .5s .2s ease both; }
.anim-rise-d3 { animation: riseIn .5s .3s ease both; }
.anim-rise-d4 { animation: riseIn .5s .4s ease both; }
.anim-scale { animation: scaleIn .5s ease both; }
.anim-slide { animation: slideLeft .5s ease both; }
.anim-pulse { animation: pulse 2s ease-in-out infinite; }

/* ---- Data bar ---- */
.bar-row { display:flex; align-items:center; gap:10px; margin:6px 0; }
.bar-label { width:100px; text-align:right; font-size:.85em; color:var(--muted); flex-shrink:0; }
.bar-track { flex:1; height:7px; background:var(--border); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; width:0; transition:width 1s ease .3s; }

/* ---- Table ---- */
.table-wrap { overflow-x:auto; width:100%; max-width:880px; }
table { width:100%; border-collapse:collapse; font-size:.9em; }
th { text-align:left; padding:10px 14px; border-bottom:2px solid var(--border); color:var(--accent); font-weight:600; font-size:.85em; }
td { padding:10px 14px; border-bottom:1px solid var(--border); }
tr:hover td { background:rgba(255,255,255,.015); }

/* ---- Four Box ---- */
.four-box { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:880px; }
.four-item {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:28px; text-align:center;
}
.four-item .icon { font-size:2.4em; margin-bottom:8px; }
.four-item .title { font-weight:700; font-size:1.1em; margin-bottom:4px; }
.four-item .sub { color:var(--muted); font-size:.85em; }

/* ---- Comparison ---- */
.compare-row { display:flex; gap:20px; width:100%; max-width:880px; }
.compare-col { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; }
.compare-col h3 { font-size:1em; margin-bottom:12px; }

/* ---- Responsive ---- */
@media (max-width:768px) {
  .scene { padding:50px 18px 160px; }
  .card { padding:24px 20px; }
  h1 { font-size:1.6em; }
  .grid-2,.grid-3,.four-box { grid-template-columns:1fr; }
  .compare-row { flex-direction:column; }
  .narration-bar { bottom:120px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <span class="logo">《代号：搜哈》CE方案分析</span>
  <span class="chapter-tag" id="chapterTag">第1章</span>
</div>

<!-- Progress -->
<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

<!-- Narration (subtitle) -->
<div class="narration-bar" id="narrationBar">
  <div class="narration-label">口播</div>
  <div class="narration-text" id="narrationText"></div>
</div>

<!-- Timeline dots (center bottom above controls) -->
<div style="position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:180;" class="timeline-dots" id="timelineDots"></div>

<!-- Main Stage -->
<main class="stage" id="stage">
  <!-- Scenes will be injected by JS -->
</main>

<!-- Controls -->
<nav class="controls">
  <button class="btn" id="btnPrev" onclick="controls.prev()">⟵</button>
  <button class="btn btn-play" id="btnPlay" onclick="controls.toggle()">▶ 播放</button>
  <button class="btn" id="btnNext" onclick="controls.next()">⟶</button>
  <span style="color:var(--muted);font-size:.85em;min-width:50px;text-align:center;" id="timeDisplay">00:00</span>
</nav>

<script>
// ============================================================
// 口播稿 + 场景数据（按 Ai好记 框架：口播稿驱动画面）
// ============================================================
const scenes = [
  // Chapter 0 — 开篇
  {
    chapter: "开篇",
    duration: 7,
    narration: "这个方案，乍一看挺像样。但仔细读下来，有三个地方是空的——空的。不是写得不好，是根本没写。",
    build: (ctx) => `

    build: (ctx) => `

  // Chapter 1 — 硬伤
  {
    chapter: "第1章·硬伤",
    duration: 9,
    narration: "好，亮点说完了。现在来看问题。第一个，也是最致命的一个——测试对象，完全空白。方案第三节，只有标题，没有内容。",

    build: (ctx) => `

        </div>
        <div class="compare-col anim-rise-d1" style="border-top:3px solid var(--red);">
          <h3 style="color:var(--red);">缺失</h3>
          <ul style="list-style:none;padding:0;">
            <li style="padding:6px 0;color:var(--red);">❌ 各维度用什么指标判断好坏？</li>
            <li style="padding:6px 0;color:var(--red);">❌ 观察数据 / 问卷 / 访谈怎么 triangulate？</li>

    build: (ctx) => `

          <div class="anim-rise" style="background:rgba(255,255,255,.03);padding:16px 20px;border-radius:8px;text-align:center;">

          </div>

  {

    duration: 7,

    build: (ctx) => `
      <h2>三个中等风险</h2>

// ============================================================
// 引擎
// ============================================================
let currentIdx = 0;
let playing = false;
let sceneTimer = null;
let elapsedInScene = 0;
let tickInterval = null;

const $stage = document.getElementById('stage');
const $narrationBar = document.getElementById('narrationBar');
const $narrationText = document.getElementById('narrationText');
const $chapterTag = document.getElementById('chapterTag');
const $progressFill = document.getElementById('progressFill');
const $timeDisplay = document.getElementById('timeDisplay');
const $timelineDots = document.getElementById('timelineDots');
const $btnPlay = document.getElementById('btnPlay');
const $btnPrev = document.getElementById('btnPrev');
const $btnNext = document.getElementById('btnNext');

// Build timeline dots
scenes.forEach((_, i) => {
  const dot = document.createElement('span');
  dot.className = 'timeline-dot';
  dot.title = `场景 ${i+1}: ${scenes[i].chapter}`;
  dot.onclick = () => goTo(i);
  $timelineDots.appendChild(dot);
});

// Build scene DOM
scenes.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'scene';
  el.id = `scene-${i}`;
  el.innerHTML = `<div class="chapter-marker">${s.chapter}</div>`;
  $stage.appendChild(el);
});

function renderScene(i) {
  const el = document.getElementById(`scene-${i}`);
  const s = scenes[i];
  el.innerHTML = `<div class="chapter-marker">${s.chapter}</div>` + s.build({});
}

function showScene(i) {
  // Hide all
  document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
  // Render & show current
  renderScene(i);
  const el = document.getElementById(`scene-${i}`);
  requestAnimationFrame(() => el.classList.add('active'));

  // Narration
  $narrationText.textContent = scenes[i].narration;
  $narrationBar.classList.add('visible');

  // Chapter tag
  $chapterTag.textContent = scenes[i].chapter;

  // Update dots
  document.querySelectorAll('.timeline-dot').forEach((d, j) => {
    d.className = 'timeline-dot';
    if (j < i) d.classList.add('done');
    if (j === i) d.classList.add('current');
  });

  // Progress
  $progressFill.style.width = ((i+1) / scenes.length * 100) + '%';
}

function goTo(i) {
  if (i < 0 || i >= scenes.length) return;
  stopAuto();
  currentIdx = i;
  elapsedInScene = 0;
  showScene(i);
  updateTime();
  updateButtons();
}

function updateTime() {
  const m = Math.floor(elapsedInScene / 60);
  const s = elapsedInScene % 60;
  $timeDisplay.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateButtons() {
  $btnPrev.disabled = currentIdx === 0;
  $btnNext.disabled = currentIdx === scenes.length - 1;
}

function stopAuto() {
  playing = false;
  clearTimeout(sceneTimer);
  clearInterval(tickInterval);
  $btnPlay.textContent = '▶ 播放';
}

function startAuto() {
  if (currentIdx >= scenes.length - 1) { currentIdx = 0; showScene(0); }
  playing = true;
  $btnPlay.textContent = '⏸ 暂停';
  scheduleNext();
  tickInterval = setInterval(() => {
    elapsedInScene++;
    updateTime();
    // Auto-advance if stuck past duration + 2s grace
    if (elapsedInScene > scenes[currentIdx].duration + 2) {
      if (currentIdx < scenes.length - 1) { goTo(currentIdx + 1); if (playing) scheduleNext(); }
      else stopAuto();
    }
  }, 1000);
}

function scheduleNext() {
  clearTimeout(sceneTimer);
  const dur = scenes[currentIdx].duration * 1000;
  sceneTimer = setTimeout(() => {
    if (!playing) return;
    if (currentIdx < scenes.length - 1) {
      goTo(currentIdx + 1);
      scheduleNext();
    } else {
      stopAuto();
    }
  }, dur);
}

const controls = {
  toggle() {
    if (playing) stopAuto();
    else startAuto();
  },
  next() { stopAuto(); goTo(currentIdx + 1); },
  prev() { stopAuto(); goTo(currentIdx - 1); }
};

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); controls.toggle(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); controls.next(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); controls.prev(); }
  if (e.key === 'Escape') { stopAuto(); }
});

// Init
goTo(0);

console.log('《代号：搜哈》CE方案分析 — Web Video Presentation');
console.log('场景数:', scenes.length);
console.log('总时长:', scenes.reduce((a,s)=>a+s.duration,0), '秒');
console.log('操作: 空格=播放/暂停 | ←→=前后翻页 | Esc=停止');
